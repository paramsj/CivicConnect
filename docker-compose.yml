services:
  # ----------------------------------------------------------------------------
  # 1. Redis Service (Isolated inside Docker network — NO host port binding)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: civicconnect-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - civicconnect-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Optional Local MongoDB Database (Only needed if NOT using a cloud/Atlas URL)
  #    Run with: docker compose --profile local-mongo up
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: civicconnect-mongodb
    restart: unless-stopped
    profiles:
      - local-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - civicconnect-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Python ML & Image Classification Microservice (Port 7860)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: civicconnect-ai
    restart: unless-stopped
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1
    networks:
      civicconnect-net:
        aliases:
          - ai-service
          - python-server
    volumes:
      - clip_cache:/home/user/.cache/clip
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ----------------------------------------------------------------------------
  # 4. Node.js Backend API & BullMQ Queue Worker (Port 8000)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicconnect-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - ML_API_URL=http://ai-service:7860/predict
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:5174}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-1d}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-10d}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - uploads_data:/app/public/temp
    networks:
      - civicconnect-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 5. Single Unified Web Server (Official Nginx Alpine Image) — Port 80
  #
  #    Serves both Client and Admin SPAs and reverse-proxies APIs:
  #    - http://localhost/         → Citizen Client
  #    - http://localhost/admin    → Admin Portal (no auth barrier, change status directly)
  #    - http://localhost/api/     → Backend REST API
  #    - http://localhost/ai/      → Python ML Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: civicconnect-web
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - civicconnect-net

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  clip_cache:
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  civicconnect-net:
    driver: bridge
