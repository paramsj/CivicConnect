worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 20M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # -------------------------------------------------------------------------
    # Upstream Backend & AI Microservices
    # -------------------------------------------------------------------------
    upstream backend_api {
        server backend:8000;
    }

    upstream ai_service {
        server ai-service:7860;
    }

    # -------------------------------------------------------------------------
    # Unified Web Gateway — Port 80
    #
    #   http://localhost/         → Citizen Client (SPA)
    #   http://localhost/admin    → Admin Dashboard (SPA)
    #   http://localhost/api/     → Backend REST API
    #   http://localhost/ai/      → Python ML Service
    #   http://localhost/health   → Backend Healthcheck
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---------------------------------------------------------------------
        # 1. Admin Portal (/admin) — Direct access without auth barrier
        # ---------------------------------------------------------------------
        location ^~ /admin {
            try_files $uri $uri/ /admin/index.html;
        }

        # ---------------------------------------------------------------------
        # 2. Citizen Client (root /)
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # 3. Backend REST API (/api/)
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Server-Sent Events (SSE) streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # ---------------------------------------------------------------------
        # 4. Backend Health Check
        # ---------------------------------------------------------------------
        location = /health {
            proxy_pass http://backend_api/health;
        }

        # ---------------------------------------------------------------------
        # 5. Python ML AI Service (/ai/)
        # ---------------------------------------------------------------------
        location /ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ---------------------------------------------------------------------
        # 6. AI Health Check
        # ---------------------------------------------------------------------
        location = /ai/health {
            proxy_pass http://ai_service/health;
        }
    }
}
